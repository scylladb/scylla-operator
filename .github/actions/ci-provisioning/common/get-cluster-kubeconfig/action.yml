name: Get a provisioned cluster's kubeconfig
description: Extracts the kubeconfig of a provisioned cluster from its Secret into a file and sanity checks it.

inputs:
  provisioners-kubeconfig:
    description: Path to the CI provisioners cluster kubeconfig.
    required: true
  secret-name:
    description: Name of the Secret holding the provisioned cluster's kubeconfig.
    required: true

outputs:
  path:
    description: Path to the provisioned cluster's kubeconfig.
    value: ${{ steps.get.outputs.path }}

runs:
  using: composite
  steps:
  - id: get
    shell: bash
    env:
      KUBECONFIG: ${{ inputs.provisioners-kubeconfig }}
      SECRET_NAME: ${{ inputs.secret-name }}
    run: |
      source ./hack/.ci/lib/ci-provisioning.sh

      kubeconfig="${RUNNER_TEMP}/kubeconfig"
      get-provisioned-cluster-kubeconfig "${SECRET_NAME}" "${kubeconfig}"

      echo "path=${kubeconfig}" >> "${GITHUB_OUTPUT}"
