name: Get a provisioned cluster's kubeconfig
description: Extracts the kubeconfig of a provisioned cluster from its Secret into a file and sanity checks it.

inputs:
  provisioners-kubeconfig:
    description: Path to the CI provisioners cluster kubeconfig.
    required: true
  secret-name:
    description: Name of the Secret holding the provisioned cluster's kubeconfig.
    required: true

outputs:
  path:
    description: Path to the provisioned cluster's kubeconfig.
    value: ${{ steps.get.outputs.path }}

runs:
  using: composite
  steps:
  - id: get
    shell: bash
    env:
      KUBECONFIG: ${{ inputs.provisioners-kubeconfig }}
      SECRET_NAME: ${{ inputs.secret-name }}
    run: |
      set -euExo pipefail
      shopt -s inherit_errexit

      kubeconfig="${RUNNER_TEMP}/kubeconfig"
      ( umask 077; kubectl get secret/"${SECRET_NAME}" --template='{{ .data.kubeconfig }}' | base64 -d > "${kubeconfig}" )

      # The e2e machinery creates its own namespaces; pointing the current context at a nonexistent one keeps an
      # unqualified command from silently acting on `default`.
      kubectl --kubeconfig="${kubeconfig}" config set-context --current --namespace 'default-unexisting-namespace'

      # Sanity check.
      kubectl --kubeconfig="${kubeconfig}" version -o yaml
      kubectl --kubeconfig="${kubeconfig}" config view

      echo "path=${kubeconfig}" >> "${GITHUB_OUTPUT}"
