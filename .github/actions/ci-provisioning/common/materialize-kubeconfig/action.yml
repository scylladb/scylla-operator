name: Materialize the CI provisioners kubeconfig
description: Writes the CI provisioners cluster kubeconfig from a secret into a file.

inputs:
  kubeconfig:
    description: Kubeconfig content of the cluster to create the CI provisioning objects in.
    required: true

outputs:
  path:
    description: Path to the written kubeconfig.
    value: ${{ steps.write.outputs.path }}

runs:
  using: composite
  steps:
  - id: write
    shell: bash
    env:
      CI_PROVISIONERS_KUBECONFIG: ${{ inputs.kubeconfig }}
    run: |
      set -euEo pipefail
      shopt -s inherit_errexit

      # Otherwise the missing secret only surfaces as an unrelated kubectl error further down.
      if [[ -z "${CI_PROVISIONERS_KUBECONFIG}" ]]; then
        echo '::error::The CI provisioners kubeconfig is empty. GitHub does not pass secrets to runs of pull requests from forks. If this is a pull request from a fork, this is expected and needs no action from you: a maintainer will run the e2e suites for it.'
        exit 1
      fi

      kubeconfig="${RUNNER_TEMP}/ci-provisioners-kubeconfig"
      ( umask 077; printf '%s\n' "${CI_PROVISIONERS_KUBECONFIG}" > "${kubeconfig}" )
      echo "path=${kubeconfig}" >> "${GITHUB_OUTPUT}"
