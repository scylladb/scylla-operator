name: Clean up GKE clusters
description: >-
  Deletes the KubernetesClusterSet, or the single KubernetesCluster, created by provision-clusters without waiting for
  it to go away. The objects carry a TTL, so a leak is bounded rather than permanent, but deleting them eagerly frees the
  quota for the jobs queued behind.

inputs:
  provisioners-kubeconfig:
    description: Path to the CI provisioners cluster kubeconfig.
    required: true
  object-name:
    description: Name of the provisioned object, as passed to provision-clusters.
    required: true

runs:
  using: composite
  steps:
  - shell: bash
    env:
      KUBECONFIG: ${{ inputs.provisioners-kubeconfig }}
      OBJECT_NAME: ${{ inputs.object-name }}
    run: |
      set -euExo pipefail
      shopt -s inherit_errexit

      # Only one of the two kinds exists for a given name.
      kubectl delete --wait=false --ignore-not-found kubernetescluster/"${OBJECT_NAME}" kubernetesclusterset/"${OBJECT_NAME}"
