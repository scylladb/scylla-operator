name: Provision a GCS bucket
description: Creates a GCS StorageBucket, waits for it and extracts its service account credentials into a file.

inputs:
  provisioners-kubeconfig:
    description: Path to the CI provisioners cluster kubeconfig.
    required: true
  name:
    description: Name for the StorageBucket object.
    required: true
  location:
    description: GCS location to create the bucket in.
    required: true
  ttl-seconds:
    description: Time after which the provisioner deletes the bucket regardless of the workflow outcome.
    required: false
    default: "14400"

outputs:
  bucket-name:
    description: Name of the provisioned bucket.
    value: ${{ steps.provision.outputs.bucket-name }}
  credentials-path:
    description: Path to the service account JSON credentials with access to the bucket.
    value: ${{ steps.provision.outputs.credentials-path }}

runs:
  using: composite
  steps:
  - id: provision
    shell: bash
    env:
      KUBECONFIG: ${{ inputs.provisioners-kubeconfig }}
      OBJECT_NAME: ${{ inputs.name }}
      LOCATION: ${{ inputs.location }}
      TTL_SECONDS: ${{ inputs.ttl-seconds }}
    run: |
      source ./hack/.ci/lib/ci-provisioning.sh

      credentials="${RUNNER_TEMP}/gcs-service-account.json"
      provision-storage-bucket "${OBJECT_NAME}" "${credentials}" <<EOF
      apiVersion: ci.scylladb.com/v1alpha1
      kind: StorageBucket
      metadata:
        name: "${OBJECT_NAME}"
      spec:
        ttlSeconds: ${TTL_SECONDS}
        type: GCS
        gcs:
          location: ${LOCATION}
        credentialsSecret:
          name: "${OBJECT_NAME}-gcs-service-account"
      EOF

      {
        echo "bucket-name=$( kubectl get storagebucket/"${OBJECT_NAME}" --template='{{ .status.bucketName }}' )"
        echo "credentials-path=${credentials}"
      } >> "${GITHUB_OUTPUT}"
