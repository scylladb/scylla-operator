name: Provision GCS buckets
description: >-
  Creates a GCS StorageBucket per location, waits for them and extracts their service account credentials into files.

inputs:
  provisioners-kubeconfig:
    description: Path to the CI provisioners cluster kubeconfig.
    required: true
  name-prefix:
    description: >-
      Prefix for the StorageBucket object names. The action names each bucket `<name-prefix>-<key>` after the
      `locations` entry it creates it for.
    required: true
  locations:
    description: >-
      GCS location per bucket, as `<key>=<location>,...`. The action creates one bucket per entry and keys its outputs
      the same way.
    required: true
  ttl-seconds:
    description: Time after which the provisioner deletes the buckets regardless of the workflow outcome.
    required: false
    default: "14400"

outputs:
  object-names:
    description: >-
      Names of the StorageBucket objects, comma-separated, for a teardown to delete. Written before the action creates
      anything, so a failure partway still leaves them available.
    value: ${{ steps.provision.outputs.object-names }}
  bucket-names:
    description: Name of each provisioned bucket, as `<key>=<bucket>,...`.
    value: ${{ steps.provision.outputs.bucket-names }}
  credentials-paths:
    description: Path to the service account JSON credentials with access to each bucket, as `<key>=<path>,...`.
    value: ${{ steps.provision.outputs.credentials-paths }}

runs:
  using: composite
  steps:
  - id: provision
    shell: bash
    env:
      KUBECONFIG: ${{ inputs.provisioners-kubeconfig }}
      NAME_PREFIX: ${{ inputs.name-prefix }}
      LOCATIONS: ${{ inputs.locations }}
      TTL_SECONDS: ${{ inputs.ttl-seconds }}
    run: |
      set -euExo pipefail
      shopt -s inherit_errexit

      # GHA doesn't enforce required inputs of composite actions, and an empty location would only fail once the
      # suite tries to use the bucket.
      if [[ -z "${LOCATIONS}" ]]; then
        echo "locations can't be empty" >&2
        exit 2
      fi
      IFS=',' read -r -a entries <<< "${LOCATIONS}"
      for entry in "${entries[@]}"; do
        if [[ ! "${entry}" =~ ^[^=]+=.+$ ]]; then
          echo "Invalid locations entry '${entry}', expected '<key>=<location>'" >&2
          exit 2
        fi
      done

      object_names=( "${entries[@]/#/${NAME_PREFIX}-}" )
      object_names=( "${object_names[@]%%=*}" )
      echo "object-names=$( IFS=','; echo "${object_names[*]}" )" >> "${GITHUB_OUTPUT}"

      for entry in "${entries[@]}"; do
        key="${entry%%=*}"
        location="${entry#*=}"
        object_name="${NAME_PREFIX}-${key}"

        kubectl create -f - <<EOM
      apiVersion: ci.scylladb.com/v1alpha1
      kind: StorageBucket
      metadata:
        name: "${object_name}"
      spec:
        ttlSeconds: ${TTL_SECONDS}
        type: GCS
        gcs:
          location: ${location}
        credentialsSecret:
          name: "${object_name}-gcs-service-account"
      EOM
      done

      # Created first and waited for together, so the bound is 5m regardless of how many there are.
      kubectl wait --timeout=5m \
        --for=condition=Degraded=False \
        --for=condition=Progressing=False \
        "${object_names[@]/#/storagebucket/}"

      buckets=()
      credentials=()
      for entry in "${entries[@]}"; do
        key="${entry%%=*}"
        object_name="${NAME_PREFIX}-${key}"
        # Named after the object so that the buckets don't overwrite each other's credentials. e2e.sh also keys the
        # worker credentials Secret by file basename.
        credentials_path="${RUNNER_TEMP}/${object_name}-gcs-service-account.json"

        ( umask 077; kubectl get secret/"${object_name}-gcs-service-account" --template='{{ index .data "gcs-service-account.json" }}' | base64 -d > "${credentials_path}" )

        buckets+=( "${key}=$( kubectl get storagebucket/"${object_name}" --template='{{ .status.bucketName }}' )" )
        credentials+=( "${key}=${credentials_path}" )
      done

      {
        echo "bucket-names=$( IFS=','; echo "${buckets[*]}" )"
        echo "credentials-paths=$( IFS=','; echo "${credentials[*]}" )"
      } >> "${GITHUB_OUTPUT}"
