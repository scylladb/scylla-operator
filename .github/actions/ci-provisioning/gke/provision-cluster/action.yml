name: Provision a GKE cluster
description: Creates a KubernetesCluster from a manifest and waits for it to bootstrap.

inputs:
  provisioners-kubeconfig:
    description: Path to the CI provisioners cluster kubeconfig.
    required: true
  name:
    description: Name for the KubernetesCluster object.
    required: true
  manifest:
    description: KubernetesCluster manifest with empty metadata.name and spec.credentialsSecret.name placeholders.
    required: true
  timeout:
    description: How long to wait for the cluster to bootstrap.
    required: false
    default: 15m

outputs:
  kubeconfig-secret-name:
    description: Name of the Secret holding the provisioned cluster's kubeconfig.
    value: ${{ inputs.name }}-kubeconfig
  region:
    description: GKE location of the cluster, for colocating other resources with it.
    value: ${{ steps.provision.outputs.region }}

runs:
  using: composite
  steps:
  - id: provision
    shell: bash
    env:
      KUBECONFIG: ${{ inputs.provisioners-kubeconfig }}
      OBJECT_NAME: ${{ inputs.name }}
      CLUSTER_MANIFEST: ${{ inputs.manifest }}
      TIMEOUT: ${{ inputs.timeout }}
    run: |
      set -euExo pipefail
      shopt -s inherit_errexit

      # yq creates any path it's given, so if the manifest renames a field, this would silently add the old one back
      # instead of filling in the new one. Asserting the placeholders exist first turns that into a failure.
      yq -e '
        select(.metadata.name == "" and .spec.credentialsSecret.name == "") |
        .metadata.name = strenv(OBJECT_NAME) |
        .spec.credentialsSecret.name = strenv(OBJECT_NAME) + "-kubeconfig"
      ' "${CLUSTER_MANIFEST}" | tee /dev/stderr | kubectl create -f=-

      echo "region=$( yq '.spec.gke.location' "${CLUSTER_MANIFEST}" )" >> "${GITHUB_OUTPUT}"

      timeout -v "${TIMEOUT}" bash -c 'until kubectl wait --for=condition=Degraded=False kubernetescluster/"${OBJECT_NAME}" --timeout=5m && kubectl wait --for=condition=Progressing=False kubernetescluster/"${OBJECT_NAME}" --timeout=5m && kubectl wait --for=condition=ClusterBootstrapped=True kubernetescluster/"${OBJECT_NAME}" --timeout=5m; do sleep 1; done' || {
        echo 'Cluster provisioning timed out. Object status:' >&2
        kubectl get kubernetescluster/"${OBJECT_NAME}" -o yaml | yq '.status' >&2
        exit 1
      }
