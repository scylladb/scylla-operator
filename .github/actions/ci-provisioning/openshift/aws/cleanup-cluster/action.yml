name: Clean up an OpenShift cluster on AWS
description: >-
  Deletes a KubernetesCluster created by provision-cluster without waiting for it to go away. The object carries a TTL,
  so a leak is bounded rather than permanent, but deleting it eagerly frees the AWS quota for the jobs queued behind.

inputs:
  provisioners-kubeconfig:
    description: Path to the CI provisioners cluster kubeconfig.
    required: true
  object-name:
    description: Name of the KubernetesCluster object, as provision-cluster outputs it.
    required: true

runs:
  using: composite
  steps:
  - shell: bash
    env:
      KUBECONFIG: ${{ inputs.provisioners-kubeconfig }}
      OBJECT_NAME: ${{ inputs.object-name }}
    run: |
      set -euExo pipefail
      shopt -s inherit_errexit

      kubectl delete --wait=false --ignore-not-found kubernetescluster/"${OBJECT_NAME}"
