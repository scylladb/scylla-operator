name: Provision an S3 bucket
description: Creates an S3 StorageBucket, waits for it and extracts its credentials into a file.

inputs:
  provisioners-kubeconfig:
    description: Path to the CI provisioners cluster kubeconfig.
    required: true
  name:
    description: Name for the StorageBucket object.
    required: true
  region:
    description: AWS region to create the bucket in.
    required: true
  ttl-seconds:
    description: Time after which the provisioner deletes the bucket regardless of the workflow outcome.
    required: false
    default: "14400"

outputs:
  bucket-name:
    description: Name of the provisioned bucket.
    value: ${{ steps.provision.outputs.bucket-name }}
  credentials-path:
    description: Path to the AWS credentials file with access to the bucket.
    value: ${{ steps.provision.outputs.credentials-path }}

runs:
  using: composite
  steps:
  - id: provision
    shell: bash
    env:
      KUBECONFIG: ${{ inputs.provisioners-kubeconfig }}
      OBJECT_NAME: ${{ inputs.name }}
      REGION: ${{ inputs.region }}
      TTL_SECONDS: ${{ inputs.ttl-seconds }}
    run: |
      set -euExo pipefail
      shopt -s inherit_errexit

      kubectl create -f - <<EOM
      apiVersion: ci.scylladb.com/v1alpha1
      kind: StorageBucket
      metadata:
        name: "${OBJECT_NAME}"
      spec:
        ttlSeconds: ${TTL_SECONDS}
        type: S3
        s3:
          region: ${REGION}
          tags:
            keep: "8"
        credentialsSecret:
          name: "${OBJECT_NAME}-s3-credentials"
      EOM

      kubectl wait --timeout=5m \
        --for=condition=Degraded=False \
        --for=condition=Progressing=False \
        storagebucket/"${OBJECT_NAME}"

      credentials_path="${RUNNER_TEMP}/${OBJECT_NAME}-s3-credentials"
      ( umask 077; kubectl get secret/"${OBJECT_NAME}-s3-credentials" --template='{{ index .data "credentials" }}' | base64 -d > "${credentials_path}" )

      {
        echo "bucket-name=$( kubectl get storagebucket/"${OBJECT_NAME}" --template='{{ .status.bucketName }}' )"
        echo "credentials-path=${credentials_path}"
      } >> "${GITHUB_OUTPUT}"
