name: Collect must-gather evidence
description: >
  Runs must-gather against the cluster and uploads the archive as a workflow artifact.

runs:
  using: composite
  steps:
    - name: Collect must-gather evidence
      shell: bash
      continue-on-error: true
      run: ./hack/collect-must-gather.sh "${RUNNER_TEMP}"

    - name: Upload must-gather artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        path: ${{ runner.temp }}/must-gather.tar.gz
        archive: false
        if-no-files-found: ignore
