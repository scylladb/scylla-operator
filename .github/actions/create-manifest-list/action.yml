name: Create a manifest list
description: >-
  Assembles the images `build-image` pushed by digest into a manifest list, annotated with the revision they were built
  from, and pushes it under a tag. Fails when an architecture is missing. Needs push access to the repository, e.g. from
  `write-registry-auth`. Other repositories use this action remotely, so it must not depend on anything outside its
  directory.

inputs:
  image-repo-ref:
    description: Repository the images were pushed to, and the one to push the manifest list to.
    required: true
  image-tag:
    description: Tag to push the manifest list under.
    required: true
  digest-artifact-pattern:
    description: Glob pattern matching the names of the digest artifacts of the images to assemble.
    required: true
  architectures:
    description: Space-separated architectures the manifest list has to have an image for.
    required: false
    default: amd64 arm64
  revision:
    description: Revision to record in the index's `org.opencontainers.image.revision` annotation.
    required: false
    default: ${{ github.sha }}

outputs:
  image-ref:
    description: Digest-pinned reference to the pushed manifest list.
    value: ${{ steps.push.outputs.image-ref }}

runs:
  using: composite
  steps:
  # Each call downloads into a directory of its own, so a job can assemble several manifest lists.
  - name: Make a directory for the digests
    id: digests-dir
    shell: bash
    run: |
      set -euExo pipefail
      shopt -s inherit_errexit

      echo "path=$( mktemp -d -p "${RUNNER_TEMP}" )" >> "${GITHUB_OUTPUT}"

  - name: Download the digests
    uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
    with:
      path: ${{ steps.digests-dir.outputs.path }}
      pattern: ${{ inputs.digest-artifact-pattern }}
      merge-multiple: true

  - name: Set up Docker Buildx
    uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

  - name: Create and push the manifest list
    id: push
    shell: bash
    env:
      IMAGE_REPO_REF: ${{ inputs.image-repo-ref }}
      IMAGE_TAG: ${{ inputs.image-tag }}
      DIGESTS_DIR: ${{ steps.digests-dir.outputs.path }}
      ARCHITECTURES: ${{ inputs.architectures }}
      REVISION: ${{ inputs.revision }}
    run: |
      set -euExo pipefail
      shopt -s inherit_errexit

      shopt -s nullglob
      source_refs=()
      for f in "${DIGESTS_DIR}"/*; do
        source_refs+=( "${IMAGE_REPO_REF}@sha256:$( basename "${f}" )" )
      done

      image_ref="${IMAGE_REPO_REF}:${IMAGE_TAG}"
      docker buildx imagetools create \
      --annotation="index:org.opencontainers.image.revision=${REVISION}" \
      --tag="${image_ref}" \
      "${source_refs[@]}"

      # A list missing an architecture would only surface once the pods crash-loop on its nodes.
      manifest="$( docker buildx imagetools inspect --raw "${image_ref}" )"
      read -r -a architectures <<< "${ARCHITECTURES}"
      for arch in "${architectures[@]}"; do
        jq -e --arg arch "${arch}" 'any(.manifests[]; .platform.os == "linux" and .platform.architecture == $arch)' <<< "${manifest}"
      done

      digest="$( docker buildx imagetools inspect --format='{{ .Manifest.Digest }}' "${image_ref}" )"
      echo "image-ref=${IMAGE_REPO_REF}@${digest}" >> "${GITHUB_OUTPUT}"
