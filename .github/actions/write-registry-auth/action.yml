name: Write registry auth
description: >-
  Merges registry credentials into `~/.docker/config.json`, which buildx reads, and points `REGISTRY_AUTH_FILE`, which
  skopeo reads, at it for the rest of the job. Call it once per credentials file. It depends on nothing outside its
  directory, so it can be referenced remotely.

inputs:
  auth-json:
    description: >-
      Contents of a containers-auth.json(5) file. Only its `auths` are merged into the existing ones, so calling the
      action again adds credentials to more registries. Other fields, like `credHelpers`, are ignored.
    required: true

runs:
  using: composite
  steps:
  - shell: bash
    env:
      AUTH_JSON: ${{ inputs.auth-json }}
    # No xtrace, the auth is the credential.
    run: |
      set -euEo pipefail
      shopt -s inherit_errexit

      if [[ -z "${AUTH_JSON//[[:space:]]/}" ]]; then
        echo '::error::The registry auth is empty. GitHub does not pass secrets to runs of pull requests from forks. If this is a pull request from a fork, this is expected and needs no action from you: a maintainer will run the e2e suites for it.'
        exit 1
      fi

      # containers-auth.json(5) shares the "auths" format with docker's config.json, so buildx picks it up as is.
      umask 077
      mkdir -p ~/.docker
      config=~/.docker/config.json
      if [[ ! -f "${config}" ]]; then
        echo '{}' > "${config}"
      fi
      jq '.auths += (env.AUTH_JSON | fromjson | .auths)' "${config}" > "${config}.tmp"
      mv "${config}.tmp" "${config}"
      echo "REGISTRY_AUTH_FILE=${config}" >> "${GITHUB_ENV}"
