name: Write registry auth
description: >-
  Writes registry credentials to `~/.docker/config.json`, which buildx reads, and points `REGISTRY_AUTH_FILE`, which
  skopeo reads, at it for the rest of the job. Other repositories use this action remotely, so it must not depend on
  anything outside its directory.

inputs:
  auth-json:
    description: >-
      Contents of one or more containers-auth.json(5) files, separated by whitespace. Their `auths` are merged, so a
      single file can hold credentials to several registries.
    required: true

runs:
  using: composite
  steps:
  - shell: bash
    env:
      AUTH_JSON: ${{ inputs.auth-json }}
    # No xtrace, the auth is the credential.
    run: |
      set -euEo pipefail
      shopt -s inherit_errexit

      if [[ -z "${AUTH_JSON//[[:space:]]/}" ]]; then
        echo '::error::The registry auth is empty. GitHub does not pass secrets to runs of pull requests from forks. If this is a pull request from a fork, this is expected and needs no action from you: a maintainer will run the e2e suites for it.'
        exit 1
      fi

      # containers-auth.json(5) shares the "auths" format with docker's config.json, so buildx picks it up as is.
      umask 077
      mkdir -p ~/.docker
      jq -s '{auths: (map(.auths) | add)}' <<< "${AUTH_JSON}" > ~/.docker/config.json
      echo "REGISTRY_AUTH_FILE=${HOME}/.docker/config.json" >> "${GITHUB_ENV}"
