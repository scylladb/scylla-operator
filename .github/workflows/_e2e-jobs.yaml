name: E2E jobs

# Every e2e job, defined once for all the workflows that run them. Runs the selected jobs against the caller's operator
# image, and the OLM catalog serving it for the jobs installing the operator through OLM. The callers select the jobs by
# their ids.
on:
  workflow_call:
    inputs:
      image-ref:
        description: Digest-pinned reference to the operator image to test, as `_image.yaml` outputs it.
        required: true
        type: string
      olm-catalog-image-ref:
        description: >-
          Digest-pinned reference to the OLM catalog serving a bundle of the operator image, as `_olm.yaml` outputs it.
        required: true
        type: string
      jobs:
        description: >-
          JSON list of glob patterns matching the ids of the jobs to run, e.g. `["gke-parallel"]`, or `["!oke-*"]` for
          every job but OKE ones, as `hack/.ci/select-jobs.sh` matches them. Runs every job when omitted.
        required: false
        type: string
      scylladb-image-ref:
        description: ScyllaDB image the suite runs against. Empty leaves the suite on its default version.
        required: false
        default: ""
        type: string
      scylladb-manager-image-ref:
        description: ScyllaDB Manager image the suite runs against. Empty leaves the suite on its default version.
        required: false
        default: ""
        type: string
      scylladb-manager-agent-image-ref:
        description: ScyllaDB Manager Agent image the suite runs against. Empty leaves the suite on its default version.
        required: false
        default: ""
        type: string
    secrets:
      ci-provisioners-kubeconfig:
        description: Kubeconfig of the cluster to create the CI provisioning objects in.
        required: true

permissions:
  contents: read

jobs:
  # A matrix creates checks only for the jobs selected, where jobs gated by `if` would all show up, the unselected ones
  # as skipped. Every entry carries every input of the workflow it calls, because a key missing from an entry passes an
  # empty value rather than the input's default, so the defaults below have to match those of the workflows they call.
  plan:
    runs-on: hosted-runners-standard-pool
    outputs:
      gke: ${{ steps.plan.outputs.gke }}
      oke: ${{ steps.plan.outputs.oke }}
      openshift: ${{ steps.plan.outputs.openshift }}
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - id: plan
      shell: bash
      env:
        JOBS: ${{ inputs.jobs }}
      run: |
        set -euExo pipefail
        shopt -s inherit_errexit

        gke_defaults='{
          "cluster-manifest": "./hack/.ci/manifests/ci-clusters/gke.yaml",
          "object-storage": false,
          "storageclass-name": "scylladb-local-xfs",
          "nodeconfig-path": "./hack/.ci/manifests/cluster/nodeconfig.yaml",
          "node-service-type": "Headless",
          "nodes-broadcast-address-type": "PodIP",
          "clients-broadcast-address-type": "PodIP"
        }'
        # The serial jobs run without a NodeConfig, so without a local storage class either, and ScyllaDB storage falls
        # back to the cluster default.
        gke='[
          {
            "id": "parallel",
            "suite": "scylla-operator/conformance/parallel",
            "object-storage": true
          },
          {
            "id": "parallel-clusterip",
            "suite": "scylla-operator/conformance/parallel",
            "object-storage": true,
            "node-service-type": "ClusterIP",
            "nodes-broadcast-address-type": "ServiceClusterIP",
            "clients-broadcast-address-type": "ServiceClusterIP"
          },
          {
            "id": "parallel-ipv6",
            "suite": "scylla-operator/conformance/parallel-ipv6",
            "cluster-manifest": "./hack/.ci/manifests/ci-clusters/gke-dual-stack.yaml",
            "object-storage": true
          },
          {
            "id": "serial",
            "suite": "scylla-operator/conformance/serial",
            "cluster-manifest": "./hack/.ci/manifests/ci-clusters/gke-serial.yaml",
            "nodeconfig-path": "",
            "storageclass-name": ""
          },
          {
            "id": "arm64-parallel",
            "suite": "scylla-operator/conformance/parallel",
            "cluster-manifest": "./hack/.ci/manifests/ci-clusters/gke-arm64.yaml",
            "object-storage": true,
            "nodeconfig-path": "./hack/.ci/manifests/cluster/nodeconfig-gke-arm64.yaml"
          },
          {
            "id": "arm64-serial",
            "suite": "scylla-operator/conformance/serial",
            "cluster-manifest": "./hack/.ci/manifests/ci-clusters/gke-arm64-serial.yaml",
            "nodeconfig-path": "",
            "storageclass-name": ""
          },
          {
            "id": "multi-dc-parallel",
            "suite": "scylla-operator/conformance/multi-datacenter-parallel",
            "cluster-manifest": "./hack/.ci/manifests/ci-clusters/gke-multi-dc.yaml",
            "object-storage": true
          }
        ]'
        oke='[
          {
            "id": "parallel",
            "suite": "scylla-operator/conformance/parallel"
          },
          {
            "id": "serial",
            "suite": "scylla-operator/conformance/serial"
          }
        ]'
        openshift_defaults='{
          "cluster-manifest": "./hack/.ci/manifests/ci-clusters/openshift-aws.yaml",
          "object-storage": false,
          "storageclass-name": "scylladb-local-xfs",
          "nodeconfig-path": "./hack/.ci/manifests/cluster/nodeconfig-openshift-aws.yaml"
        }'
        openshift='[
          {
            "id": "aws-parallel",
            "suite": "scylla-operator/conformance/parallel/openshift",
            "object-storage": true
          },
          {
            "id": "aws-serial",
            "suite": "scylla-operator/conformance/serial",
            "cluster-manifest": "./hack/.ci/manifests/ci-clusters/openshift-aws-serial.yaml",
            "nodeconfig-path": "",
            "storageclass-name": ""
          }
        ]'

        # The ids are selected across platforms, so each is prefixed with the platform it runs on, e.g. `gke-parallel`.
        for platform in gke oke openshift; do
          printf -v "${platform}" '%s' \
            "$( jq -c --arg platform "${platform}" 'map(.id = "\($platform)-\(.id)")' <<< "${!platform}" )"
        done
        mapfile -t ids < <( jq -sr 'add | .[].id' <<< "${gke} ${oke} ${openshift}" )
        SELECTED="$( ./hack/.ci/select-jobs.sh "${JOBS:-[\"*\"]}" "${ids[@]}" )"
        export SELECTED
        select='(env.SELECTED | fromjson) as $jobs | map(select(.id | IN($jobs[])))'
        {
          echo "gke=$( jq -c --argjson defaults "${gke_defaults}" "${select} | map(\$defaults + .)" <<< "${gke}" )"
          echo "oke=$( jq -c "${select}" <<< "${oke}" )"
          echo "openshift=$( jq -c --argjson defaults "${openshift_defaults}" "${select} | map(\$defaults + .)" <<< "${openshift}" )"
        } >> "${GITHUB_OUTPUT}"

  gke:
    needs: plan
    # An empty matrix is an error.
    if: needs.plan.outputs.gke != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.gke) }}
    # Referencing the matrix keeps GitHub from appending its values to the name.
    name: ${{ format('gke', matrix.id) }}
    uses: ./.github/workflows/_e2e-gke.yaml
    with:
      name: ${{ matrix.id }}
      image-ref: ${{ inputs.image-ref }}
      suite: ${{ matrix.suite }}
      scylladb-image-ref: ${{ inputs.scylladb-image-ref }}
      scylladb-manager-image-ref: ${{ inputs.scylladb-manager-image-ref }}
      scylladb-manager-agent-image-ref: ${{ inputs.scylladb-manager-agent-image-ref }}
      cluster-manifest: ${{ matrix.cluster-manifest }}
      object-storage: ${{ matrix.object-storage }}
      storageclass-name: ${{ matrix.storageclass-name }}
      nodeconfig-path: ${{ matrix.nodeconfig-path }}
      node-service-type: ${{ matrix.node-service-type }}
      nodes-broadcast-address-type: ${{ matrix.nodes-broadcast-address-type }}
      clients-broadcast-address-type: ${{ matrix.clients-broadcast-address-type }}
    secrets:
      ci-provisioners-kubeconfig: ${{ secrets.ci-provisioners-kubeconfig }}

  oke:
    needs: plan
    # An empty matrix is an error.
    if: needs.plan.outputs.oke != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.oke) }}
    # Referencing the matrix keeps GitHub from appending its values to the name.
    name: ${{ format('oke', matrix.id) }}
    uses: ./.github/workflows/_e2e-oke.yaml
    with:
      name: ${{ matrix.id }}
      image-ref: ${{ inputs.image-ref }}
      suite: ${{ matrix.suite }}
      scylladb-image-ref: ${{ inputs.scylladb-image-ref }}
      scylladb-manager-image-ref: ${{ inputs.scylladb-manager-image-ref }}
      scylladb-manager-agent-image-ref: ${{ inputs.scylladb-manager-agent-image-ref }}
    secrets:
      ci-provisioners-kubeconfig: ${{ secrets.ci-provisioners-kubeconfig }}

  openshift:
    needs: plan
    # An empty matrix is an error.
    if: needs.plan.outputs.openshift != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.openshift) }}
    # Referencing the matrix keeps GitHub from appending its values to the name.
    name: ${{ format('openshift', matrix.id) }}
    uses: ./.github/workflows/_e2e-openshift-aws.yaml
    with:
      name: ${{ matrix.id }}
      image-ref: ${{ inputs.image-ref }}
      olm-catalog-image-ref: ${{ inputs.olm-catalog-image-ref }}
      suite: ${{ matrix.suite }}
      scylladb-image-ref: ${{ inputs.scylladb-image-ref }}
      scylladb-manager-image-ref: ${{ inputs.scylladb-manager-image-ref }}
      scylladb-manager-agent-image-ref: ${{ inputs.scylladb-manager-agent-image-ref }}
      cluster-manifest: ${{ matrix.cluster-manifest }}
      object-storage: ${{ matrix.object-storage }}
      storageclass-name: ${{ matrix.storageclass-name }}
      nodeconfig-path: ${{ matrix.nodeconfig-path }}
    secrets:
      ci-provisioners-kubeconfig: ${{ secrets.ci-provisioners-kubeconfig }}
