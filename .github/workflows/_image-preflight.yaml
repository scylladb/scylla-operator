name: "Image preflight"

# Runs the Red Hat certification preflight checks for an image against the operator's certification component and,
# when asked to, submits the results. Preflight checks every platform of a manifest list.
on:
  workflow_call:
    inputs:
      image-repo-ref:
        description: Repository of the image to check.
        required: true
        type: string
      image-tag:
        description: Tag of the image to check. Pyxis records it with the results.
        required: true
        type: string
      submit:
        description: Whether to submit the results to Red Hat.
        required: false
        default: false
        type: boolean
    secrets:
      pyxis-api-token:
        description: Red Hat Container API key. It selects the component's policy and, with submit, submits the results.
        required: true

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  preflight:
    name: preflight
    runs-on: ubuntu-latest
    container:
      image: quay.io/scylladb/scylla-operator-images:kube-tools
    timeout-minutes: 15
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Read the certification component
      id: metadata
      run: |
        source ./hack/lib/assets.sh
        echo "component-id=$( get-metadata '.operator.redHatCertificationImageComponentID' )" >> "${GITHUB_OUTPUT}"

    - name: Run preflight
      uses: ./.github/actions/certify-image
      with:
        image-repo-ref: ${{ inputs.image-repo-ref }}
        image-tag: ${{ inputs.image-tag }}
        component-id: ${{ steps.metadata.outputs.component-id }}
        submit: ${{ inputs.submit }}
        pyxis-api-token: ${{ secrets.pyxis-api-token }}
