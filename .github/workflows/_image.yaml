name: Image

# Builds the operator image from the checked out ref, natively on amd64 and arm64 runners, and publishes it under a
# caller-supplied tag as a manifest list. Outputs a digest-pinned reference to it.
on:
  workflow_call:
    inputs:
      image-repo-ref:
        description: Repository to publish the image to.
        required: false
        type: string
        default: quay.io/scylladb-dev/ci
      image-tag:
        description: Tag to publish the manifest list under.
        required: true
        type: string
    outputs:
      image-ref:
        description: Digest-pinned reference to the published manifest list.
        value: ${{ jobs.manifest.outputs.image-ref }}
    secrets:
      registry-auth-json:
        description: Contents of a containers-auth.json(5) file with push access to the target repository.
        required: true

defaults:
  run:
    shell: bash

permissions:
  contents: read

env:
  IMAGE_REPO_REF: ${{ inputs.image-repo-ref }}

jobs:
  # Each leg pushes its image by digest only and hands the digest over to the manifest job as an artifact, following
  # https://docs.docker.com/build/ci/github-actions/multi-platform/#distribute-build-across-multiple-runners.
  build:
    name: build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: amd64
          runner: hosted-runners-standard-pool
        - arch: arm64
          runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Write registry auth
      uses: ./.github/actions/write-registry-auth
      with:
        auth-json: ${{ secrets.registry-auth-json }}

    - name: Build the image
      uses: ./.github/actions/build-image
      with:
        image-repo-ref: ${{ env.IMAGE_REPO_REF }}
        arch: ${{ matrix.arch }}
        cache-scope: image-${{ matrix.arch }}
        digest-artifact-name: image-digest-${{ matrix.arch }}

  manifest:
    name: manifest
    needs: build
    runs-on: hosted-runners-standard-pool
    timeout-minutes: 10
    outputs:
      image-ref: ${{ steps.push.outputs.image-ref }}
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Write registry auth
      uses: ./.github/actions/write-registry-auth
      with:
        auth-json: ${{ secrets.registry-auth-json }}

    - name: Create the manifest list
      id: push
      uses: ./.github/actions/create-manifest-list
      with:
        image-repo-ref: ${{ env.IMAGE_REPO_REF }}
        image-tag: ${{ inputs.image-tag }}
        digest-artifact-pattern: image-digest-*
