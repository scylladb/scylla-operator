name: OLM

# Builds the OLM bundle deploying a given operator image and a catalog serving it, and publishes them under
# caller-supplied tags. Outputs digest-pinned references to both. If both tags already exist, the workflow reuses them
# instead of building them again. Like the image workflow, every run also tags the images with tags of its own, so that
# the registry doesn't delete them when an overlapping run moves the caller-supplied tags.
on:
  workflow_call:
    inputs:
      image-ref:
        description: Digest-pinned reference to the operator image the bundle deploys.
        required: true
        type: string
      bundle-image-tag:
        description: Tag to publish the bundle under, in the quay.io/scylladb-dev/ci repository.
        required: true
        type: string
      catalog-image-tag:
        description: Tag to publish the catalog under, in the quay.io/scylladb-dev/ci repository.
        required: true
        type: string
    outputs:
      bundle-ref:
        description: Digest-pinned reference to the published bundle.
        value: ${{ jobs.lookup.outputs.bundle-ref || jobs.bundle.outputs.bundle-ref }}
      catalog-ref:
        description: Digest-pinned reference to the published catalog.
        value: ${{ jobs.lookup.outputs.catalog-ref || jobs.catalog-image.outputs.catalog-ref }}
    secrets:
      registry-auth-json:
        description: Contents of a containers-auth.json(5) file with push access to the target repository.
        required: true

defaults:
  run:
    shell: bash

permissions:
  contents: read

env:
  IMAGE_REPO_REF: quay.io/scylladb-dev/ci

jobs:
  # The repository is public, so looking the tags up needs no auth. The catalog references the bundle, so the outputs
  # are only set when both exist.
  lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      bundle-ref: ${{ steps.lookup.outputs.bundle-ref }}
      catalog-ref: ${{ steps.lookup.outputs.catalog-ref }}
    steps:
    - name: Look up the tags
      id: lookup
      env:
        BUNDLE_IMAGE_TAG: ${{ inputs.bundle-image-tag }}
        CATALOG_IMAGE_TAG: ${{ inputs.catalog-image-tag }}
      run: |
        set -euExo pipefail
        shopt -s inherit_errexit

        if bundle_digest="$( docker buildx imagetools inspect --format='{{ .Manifest.Digest }}' "${IMAGE_REPO_REF}:${BUNDLE_IMAGE_TAG}" )" &&
          catalog_digest="$( docker buildx imagetools inspect --format='{{ .Manifest.Digest }}' "${IMAGE_REPO_REF}:${CATALOG_IMAGE_TAG}" )"; then
          {
            echo "bundle-ref=${IMAGE_REPO_REF}@${bundle_digest}"
            echo "catalog-ref=${IMAGE_REPO_REF}@${catalog_digest}"
          } >> "${GITHUB_OUTPUT}"
        fi

  # Every tool runs in a job with its image as the job container, and the images are built on the host, so the files
  # are handed over between the jobs as artifacts. A re-run of a job replaces the artifact the earlier attempt left
  # behind.
  postprocess:
    needs: lookup
    if: needs.lookup.outputs.catalog-ref == ''
    runs-on: ubuntu-latest
    container:
      image: quay.io/scylladb/scylla-operator-images:kube-tools
    timeout-minutes: 10
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Postprocess the bundle
      env:
        OPERATOR_IMAGE_REF: ${{ inputs.image-ref }}
      run: |
        set -euExo pipefail
        shopt -s inherit_errexit

        mkdir "${RUNNER_TEMP}/bundle"
        cp -r ./bundle/{manifests,metadata} "${RUNNER_TEMP}/bundle/"

        # Mock the version which would normally be set in the release process.
        version="0.0.1-${GITHUB_SHA}.1"
        channel="$( yq -e '.operatorTests.olm.channel' ./assets/metadata/metadata.yaml )"
        ./hack/.ci/olm/postprocess-bundle.sh "${RUNNER_TEMP}/bundle" "${version}" "${channel}"

    - name: Upload the bundle
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: olm-bundle
        path: ${{ runner.temp }}/bundle
        if-no-files-found: error
        retention-days: 7
        overwrite: true

  # The rolling `released` tag is what Red Hat's certification pipeline uses, so it stays unpinned to generate the
  # Dockerfile the same way certification does.
  dockerfile:
    needs: postprocess
    runs-on: ubuntu-latest
    container:
      image: quay.io/redhat-isv/operator-pipelines-images:released
      # The image runs as an unprivileged user by default, which can't write the runner's files in the container.
      options: --user=root
    timeout-minutes: 10
    steps:
    - name: Download the bundle
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: olm-bundle
        path: ${{ runner.temp }}/bundle

    - name: Generate the bundle Dockerfile
      run: |
        set -euExo pipefail
        shopt -s inherit_errexit

        bundle-dockerfile \
        --bundle-path="${RUNNER_TEMP}/bundle" \
        --destination="${RUNNER_TEMP}/Dockerfile" \
        --verbose

    - name: Upload the bundle Dockerfile
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: olm-bundle-dockerfile
        path: ${{ runner.temp }}/Dockerfile
        if-no-files-found: error
        retention-days: 7
        overwrite: true

  # OLM only runs on the OpenShift amd64 clusters, so the images are amd64 only.
  bundle:
    needs: dockerfile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      bundle-ref: ${{ env.IMAGE_REPO_REF }}@${{ steps.build.outputs.digest }}
    steps:
    - name: Download the bundle
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: olm-bundle
        path: ${{ runner.temp }}/bundle

    - name: Download the bundle Dockerfile
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: olm-bundle-dockerfile
        path: ${{ runner.temp }}

    # containers-auth.json(5) shares the "auths" format with docker's config.json, so buildx picks it up as is.
    - name: Write registry auth file
      env:
        REGISTRY_AUTH_JSON: ${{ secrets.registry-auth-json }}
      run: |
        if [[ -z "${REGISTRY_AUTH_JSON}" ]]; then
          echo '::error::The registry auth is empty. GitHub does not pass secrets to runs of pull requests from forks. If this is a pull request from a fork, this is expected and needs no action from you: a maintainer will run the e2e suites for it.'
          exit 1
        fi

        umask 077
        mkdir -p ~/.docker
        printf '%s' "${REGISTRY_AUTH_JSON}" > ~/.docker/config.json

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Build and push the bundle
      id: build
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: ${{ runner.temp }}/bundle
        file: ${{ runner.temp }}/Dockerfile
        platforms: linux/amd64
        labels: org.opencontainers.image.revision=${{ github.sha }}
        tags: |
          ${{ env.IMAGE_REPO_REF }}:${{ inputs.bundle-image-tag }}
          ${{ env.IMAGE_REPO_REF }}:${{ inputs.bundle-image-tag }}-${{ github.run_id }}-${{ github.run_attempt }}
        push: true

  catalog:
    needs: bundle
    runs-on: ubuntu-latest
    container:
      image: quay.io/scylladb/scylla-operator-images:kube-tools
    timeout-minutes: 10
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Build the catalog
      env:
        BUNDLE_REF: ${{ needs.bundle.outputs.bundle-ref }}
      run: ./hack/.ci/olm/build-catalog.sh "${BUNDLE_REF}" "${RUNNER_TEMP}/catalog"

    - name: Upload the catalog
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: olm-catalog
        path: ${{ runner.temp }}/catalog
        if-no-files-found: error
        retention-days: 7
        overwrite: true

  catalog-image:
    needs: catalog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      catalog-ref: ${{ env.IMAGE_REPO_REF }}@${{ steps.build.outputs.digest }}
    steps:
    - name: Download the catalog
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: olm-catalog
        path: ${{ runner.temp }}/catalog

    # containers-auth.json(5) shares the "auths" format with docker's config.json, so buildx picks it up as is.
    - name: Write registry auth file
      env:
        REGISTRY_AUTH_JSON: ${{ secrets.registry-auth-json }}
      run: |
        if [[ -z "${REGISTRY_AUTH_JSON}" ]]; then
          echo '::error::The registry auth is empty. GitHub does not pass secrets to runs of pull requests from forks. If this is a pull request from a fork, this is expected and needs no action from you: a maintainer will run the e2e suites for it.'
          exit 1
        fi

        umask 077
        mkdir -p ~/.docker
        printf '%s' "${REGISTRY_AUTH_JSON}" > ~/.docker/config.json

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Build and push the catalog
      id: build
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: ${{ runner.temp }}/catalog
        file: ${{ runner.temp }}/catalog/catalog.Dockerfile
        platforms: linux/amd64
        labels: org.opencontainers.image.revision=${{ github.sha }}
        tags: |
          ${{ env.IMAGE_REPO_REF }}:${{ inputs.catalog-image-tag }}
          ${{ env.IMAGE_REPO_REF }}:${{ inputs.catalog-image-tag }}-${{ github.run_id }}-${{ github.run_attempt }}
        push: true
