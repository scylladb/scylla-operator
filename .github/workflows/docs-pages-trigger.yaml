name: "Docs / Publish (trigger)"

# GitHub reads workflow files from the ref that a push event targets, so a workflow living only on master never runs for
# a push to a release branch and its branches. This stub is the branch-resident part: it carries no logic of its own
# and dispatches master's implementation, which rebuilds every version listed in master's docs/source/conf.py.
# It dispatches rather than calls the workflow: a called workflow runs with the caller's ref, and the github-pages
# environment only allows deployments from master.

on:
  push:
    branches:
      - 'v[0-9]+.[0-9]+'
    # The docs build reads more than docs/: literalinclude pulls from examples/ (e.g.
    # docs/source/deploy-scylladb/set-up-monitoring/setup.md), and the version_context_substitutions
    # extension reads assets/config/config.yaml, assets/metadata/metadata.yaml and .gitmodules.
    paths:
      - "docs/**"
      - "examples/**"
      - "assets/**"
      - ".gitmodules"

permissions:
  contents: read

jobs:
  publish:
    name: Dispatch docs publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch docs publish on master
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run docs-pages.yaml --repo "${GITHUB_REPOSITORY}" --ref master
