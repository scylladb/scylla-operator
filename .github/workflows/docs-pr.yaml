name: "Docs / Build PR"
# For more information,
# see https://sphinx-theme.scylladb.com/stable/deployment/production.html#available-workflows

permissions:
  contents: read

on:
  pull_request:
    branches:
      - master
    paths:
      - "docs/**"
      - "examples/**"
      - "assets/**"
      - ".gitmodules"
      - "uv.lock"
      - ".github/workflows/docs-pr.yaml"

defaults:
  run:
    shell: bash

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: safe.directory
  GIT_CONFIG_VALUE_0: "*"

jobs:
  build:
    runs-on: hosted-runners-standard-pool
    container:
      image: quay.io/scylladb/scylla-operator-images:uv-0.10
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up env
        run: make -C docs setup

      - name: Check redirects
        run: make -C docs check-redirects

      - name: Build docs
        id: docs-build
        shell: bash
        run: |
          make -C docs dirhtml SPHINXOPTS="-j auto -w $RUNNER_TEMP/docs-warnings.log" \
            2>&1 | tee "$RUNNER_TEMP/docs-build.log"

      - name: Summarize docs diagnostics
        if: always()
        uses: scylladb/sphinx-scylladb-theme/.github/actions/docs-report@0d821fc4038ee9ad6363362c02035132489bf3f6
        with:
          build-outcome: ${{ steps.docs-build.outcome }}
