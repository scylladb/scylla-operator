name: "E2E: KinD (Helm)"

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e-kind-helm:
    name: Deploy ScyllaDB on KinD using Helm
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Build operator image
        run: make image IMAGE_TAG=dev

      - name: Create KinD cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc
        with:
          cluster_name: e2e
          config: hack/kind/cluster-config.yaml

      - name: Load operator image into KinD
        run: kind load docker-image docker.io/scylladb/scylla-operator:dev --name=e2e

      - name: Deploy operator (Helm)
        run: ./hack/ci-deploy-helm.sh scylladb dev

      - name: Deploy ScyllaDB cluster and verify CQL connectivity (Helm)
        run: ./hack/ci-test-helm-scyllacluster.sh

      - name: Collect must-gather evidence
        if: failure()
        uses: ./.github/actions/collect-must-gather
