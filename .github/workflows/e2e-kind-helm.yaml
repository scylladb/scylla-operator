name: "E2E: KinD (Helm)"

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e-kind-helm:
    name: Deploy ScyllaDB on KinD using Helm
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up KinD cluster
        env:
          CLUSTER_NAME: e2e
          SO_SKIP_DEPLOYMENT: "true"
        run: ./hack/kind/cluster-setup.sh

      - name: Build operator image
        run: ./hack/kind/build-and-push-operator-image.sh dev

      - name: Deploy operator (Helm)
        run: ./hack/ci-deploy-helm.sh localhost:5001/scylladb dev

      - name: Deploy ScyllaDB cluster and verify CQL connectivity (Helm)
        run: ./hack/ci-test-helm-scyllacluster.sh

      - name: Collect must-gather evidence
        if: failure()
        uses: ./.github/actions/collect-must-gather
