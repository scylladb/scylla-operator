name: "E2E: KinD (Helm)"

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e-kind-helm:
    name: Deploy ScyllaDB on KinD using Helm
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Build operator image
        run: make image IMAGE_TAG=dev

      - name: Setup KinD cluster
        uses: ./.github/actions/setup-kind

      - name: Load operator image into KinD
        run: kind load docker-image docker.io/scylladb/scylla-operator:dev --name e2e

      - name: Deploy operator (Helm)
        run: |
          helm install scylla-operator helm/scylla-operator \
            --create-namespace \
            --namespace scylla-operator \
            --set image.repository=scylladb \
            --set image.tag=dev \
            --set replicas=1 \
            --set webhookServerReplicas=1

          # Wait for CRDs to be established.
          kubectl wait --for=condition=established --timeout=60s \
            crd/scyllaclusters.scylla.scylladb.com

          # Wait for rollout.
          kubectl -n scylla-operator rollout status --timeout=5m deployment/scylla-operator
          kubectl -n scylla-operator rollout status --timeout=5m deployment/webhook-server

      - name: Deploy ScyllaDB cluster (Helm)
        uses: ./.github/actions/deploy-scylladb-cluster

      - name: Wait for ScyllaCluster to be ready
        uses: ./.github/actions/wait-scylladb-cluster

      - name: Verify CQL connectivity
        uses: ./.github/actions/verify-cql

      - name: Collect must-gather evidence
        if: failure()
        uses: ./.github/actions/collect-must-gather
