name: "E2E (periodic)"

# Builds the operator image, and the OLM catalog deploying it, from the ref under test and runs the e2e suites against
# them in the same run.
on:
  schedule:
  - cron: '0 6 * * MON'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    uses: ./.github/workflows/_image.yaml
    with:
      image-tag: scylla-operator-${{ github.run_id }}
    secrets:
      registry-auth-json: ${{ secrets.QUAY_SCYLLADB_DEV_PR_PUBLISHER_CREDS }}

  olm:
    needs: image
    uses: ./.github/workflows/_olm.yaml
    with:
      image-ref: ${{ needs.image.outputs.image-ref }}
      bundle-image-tag: scylla-operator-bundle-${{ github.run_id }}
      catalog-image-tag: scylla-operator-catalog-${{ github.run_id }}
    secrets:
      registry-auth-json: ${{ secrets.QUAY_SCYLLADB_DEV_PR_PUBLISHER_CREDS }}

  e2e:
    needs:
    - image
    - olm
    uses: ./.github/workflows/_e2e-jobs.yaml
    with:
      image-ref: ${{ needs.image.outputs.image-ref }}
      olm-catalog-image-ref: ${{ needs.olm.outputs.catalog-ref }}
    secrets:
      ci-provisioners-kubeconfig: ${{ secrets.CI_PROVISIONERS_KUBECONFIG }}

  report-failure:
    needs: e2e
    if: ${{ failure() && github.event_name == 'schedule' }}
    runs-on: hosted-runners-standard-pool
    timeout-minutes: 5
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Report the failure to Slack
      uses: ./.github/actions/report-failure-to-slack
      with:
        webhook-url: ${{ secrets.SLACK_TEAM_OPERATOR_CI_WEBHOOK_URL }}
