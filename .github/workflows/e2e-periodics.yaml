name: "Periodic E2E"

# Builds the operator image from the ref under test and runs the e2e suites against it in the same run.
on:
  push:
    branches: [e2e-multi-dc-test]
  schedule:
  - cron: '0 6 * * MON'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    uses: ./.github/workflows/_image.yaml
    with:
      image-tag: scylla-operator-${{ github.run_id }}
    secrets:
      registry-auth-json: ${{ secrets.QUAY_SCYLLADB_DEV_PR_PUBLISHER_CREDS }}

  e2e-gke-parallel:
    needs: image
    uses: ./.github/workflows/_e2e-gke.yaml
    with:
      name: e2e-gke-parallel
      image-ref: ${{ needs.image.outputs.image-ref }}
      suite: scylla-operator/conformance/parallel
      object-storage: true
    secrets:
      ci-provisioners-kubeconfig: ${{ secrets.CI_PROVISIONERS_KUBECONFIG }}

  e2e-gke-multi-datacenter-parallel:
    needs: image
    uses: ./.github/workflows/_e2e-gke-multi-dc.yaml
    with:
      name: e2e-gke-multi-dc-parallel
      image-ref: ${{ needs.image.outputs.image-ref }}
      suite: scylla-operator/conformance/multi-datacenter-parallel
    secrets:
      ci-provisioners-kubeconfig: ${{ secrets.CI_PROVISIONERS_KUBECONFIG }}
