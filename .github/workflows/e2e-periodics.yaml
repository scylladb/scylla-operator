name: "Periodic E2E"

# Builds the operator image from the ref under test and runs the e2e suites against it in the same run.
on:
  schedule:
  - cron: '0 6 * * MON'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    uses: ./.github/workflows/_image.yaml
    with:
      image-tag: scylla-operator-${{ github.run_id }}
    secrets:
      registry-auth-json: ${{ secrets.QUAY_SCYLLADB_DEV_PR_PUBLISHER_CREDS }}

  e2e:
    needs: image
    uses: ./.github/workflows/_e2e-jobs.yaml
    with:
      image-ref: ${{ needs.image.outputs.image-ref }}
    secrets:
      ci-provisioners-kubeconfig: ${{ secrets.CI_PROVISIONERS_KUBECONFIG }}
