name: PR

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/_checks.yaml

  detect-source-changes:
    name: detect-source-changes
    runs-on: hosted-runners-standard-pool
    permissions:
      pull-requests: read
    outputs:
      source-changed: ${{ steps.source-change-detection.outputs.source }}
    steps:
      - name: Detect source changes
        id: source-change-detection
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # With 'every', a changed file counts only when it matches all rules, i.e. escapes every exclusion.
          predicate-quantifier: every
          filters: |
            source:
              - '!.github/CODEOWNERS'
              - '!docs/**'
              - '!enhancements/**'
              - '!**/*.md'
              - '!renovate.json'

  e2e-kind:
    name: e2e-kind
    needs: detect-source-changes
    if: needs.detect-source-changes.outputs.source-changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
        - id: fast
          suite: kind-fast
        # Verify that the old node-exporter bundling within the ScyllaDB container (before 2026.3) is not broken
        # (for as long as we support <2026.3).
        - id: scylladb-monitoring-old-node-exporter
          suite: kind-scylladb-monitoring
          scylladb-image-ref: docker.io/scylladb/scylla:2026.2.6
        - id: cluster-topology-sequential
          suite: kind-cluster-topology
          enable-parallel-node-operations: "false"
    uses: ./.github/workflows/_e2e-kind.yaml
    with:
      name: ${{ matrix.id }}
      suite: ${{ matrix.suite }}
      scylladb-image-ref: ${{ matrix.scylladb-image-ref }}
      enable-parallel-node-operations: ${{ matrix.enable-parallel-node-operations }}

  image:
    needs: detect-source-changes
    if: needs.detect-source-changes.outputs.source-changed == 'true'
    uses: ./.github/workflows/_image.yaml
    with:
      image-tag: scylla-operator-${{ github.run_id }}
    secrets:
      registry-auth-json: ${{ secrets.QUAY_SCYLLADB_DEV_PR_PUBLISHER_CREDS }}

  olm:
    needs: image
    uses: ./.github/workflows/_olm.yaml
    with:
      image-ref: ${{ needs.image.outputs.image-ref }}
      bundle-image-tag: scylla-operator-bundle-${{ github.run_id }}
      catalog-image-tag: scylla-operator-catalog-${{ github.run_id }}
    secrets:
      registry-auth-json: ${{ secrets.QUAY_SCYLLADB_DEV_PR_PUBLISHER_CREDS }}

  e2e:
    needs:
    - image
    - olm
    uses: ./.github/workflows/_e2e-jobs.yaml
    with:
      image-ref: ${{ needs.image.outputs.image-ref }}
      olm-catalog-image-ref: ${{ needs.olm.outputs.catalog-ref }}
      jobs: '["gke-parallel", "gke-parallel-clusterip", "gke-serial"]'
    secrets:
      ci-provisioners-kubeconfig: ${{ secrets.CI_PROVISIONERS_KUBECONFIG }}

  verify-commits:
    name: verify-commits
    runs-on: hosted-runners-standard-pool
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          # Without this, the checkout is refs/pull/N/merge, GitHub's test merge of the PR into the
          # base branch, so HEAD is a merge commit that the contributor never wrote.
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify commit messages
        run: ./hack/.ci/verify-commits.sh "${{ github.event.pull_request.base.sha }}"

  # The merge automation gates on a fixed set of contexts it is configured with, so individual GitHub Actions
  # checks are invisible to it. This aggregate is the single context it can be told to require once these jobs
  # have matured, which keeps wiring further jobs into the merge gate a one-line change here.
  check-required:
    runs-on: hosted-runners-standard-pool
    needs:
    - checks
    - detect-source-changes
    - e2e-kind
    - image
    - olm
    - e2e
    - verify-commits
    if: always()
    steps:
    - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
      run: |
        echo "Some jobs failed or were cancelled."
        exit 1
