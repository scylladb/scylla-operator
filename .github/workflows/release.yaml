name: Release

# Releases the dispatched ref as the given version. Builds the operator image, gates it on the e2e suites, pushes the
# version tag, publishes the image to the production repositories and the Helm charts to the chart repository, creates
# the GitHub release and submits the OLM bundle for certification, in that order: the tag is the output of the gate, not
# its trigger, and nothing is published for a version without one. The image is submitted for certification once it's
# published. Lives on every release branch and is dispatched on
# the branch being released.
#
# Version tags are immutable, so a release that failed after its tag is finished by dispatching it again with the same
# version. The tag records the image the gate tested, and the run publishes that image instead of building and gating
# a new one, whose digest would differ. The publishing steps are safe to repeat. A redispatch can run from any ref,
# master included, so a fix to the workflow applies to an existing tag: the ref only supplies the workflow, and
# everything published comes from the tag. A job that publishes files from the repository after the tag has to check
# out the tag rather than `github.sha`.
#
# `allow-any-ref` allows creating the tag on a ref other than the release branch of the version's minor, e.g. to test
# the release procedure from master. A regular release generally shouldn't set it.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, without the `v` prefix, e.g. `1.23.0` or `1.23.0-rc.0`.
        required: true
        type: string
      allow-any-ref:
        description: Allow creating the tag on a ref other than the release branch of the version's minor. A regular release generally shouldn't set it.
        type: boolean
        default: false

# One release at a time across all branches. Which rolling tags a version gets depends on the tags released before
# it, so two releases in flight could both decide they're the latest. GitHub keeps one more run pending, so a third
# dispatch cancels the pending one rather than queueing behind it.
concurrency:
  group: ${{ github.workflow }}

defaults:
  run:
    shell: bash

permissions:
  contents: read

env:
  # actions/checkout clones as the runner user, but the container images declare no USER, so the jobs run as root and
  # git refuses to operate on a tree it sees as foreign. actions/checkout only marks the checkout as safe while it runs,
  # not for the git invocations that come after it. safe.directory is only honoured from protected config scopes, and
  # GIT_CONFIG_COUNT/KEY/VALUE is the environment form of the command scope, so this covers every git invocation in the
  # job - including the ones the scripts shell out to - without a step in each job. The checkout paths inside the
  # container aren't known when the environment is set, so `*` rather than listing them, which trusts nothing else since
  # every job runs on a runner created for it.
  # GIT_CONFIG_COUNT is a single shared counter: anything else setting it would overwrite these rather than append.
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: safe.directory
  GIT_CONFIG_VALUE_0: "*"
  # Repository the tested image is pushed to, and the one a redispatch copies it from. The tag records only the digest,
  # which is the same in every repository the image is copied to.
  DEV_IMAGE_REPO_REF: &dev-image-repo-ref quay.io/scylladb-dev/ci

jobs:
  # Rejects a malformed version before anything is built or tested, finds the image a version that already has its tag
  # was tested with, and decides which rolling tags the image gets and whether the GitHub release is marked latest.
  plan-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      tag-exists: ${{ steps.plan.outputs.tag-exists }}
      image-ref: ${{ steps.plan.outputs.image-ref }}
      rolling-tags: ${{ steps.plan.outputs.rolling-tags }}
      latest: ${{ steps.plan.outputs.latest }}
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Plan the release
      id: plan
      uses: ./.github/actions/release/plan
      with:
        version: ${{ inputs.version }}
        allow-any-ref: ${{ inputs.allow-any-ref }}
        dev-image-repo-ref: ${{ env.DEV_IMAGE_REPO_REF }}

  # A version that already has its tag passed the gate, so the run skips straight to publishing what the tag records.
  # Skipping the image skips everything up to the tag with it.
  image:
    needs: plan-release
    if: needs.plan-release.outputs.tag-exists == 'false'
    uses: ./.github/workflows/_image.yaml
    with:
      image-repo-ref: *dev-image-repo-ref
      image-tag: scylla-operator-${{ github.run_id }}
    secrets:
      registry-auth-json: ${{ secrets.QUAY_SCYLLADB_DEV_PR_PUBLISHER_CREDS }}

  olm:
    needs: image
    uses: ./.github/workflows/_olm.yaml
    with:
      image-ref: ${{ needs.image.outputs.image-ref }}
      bundle-image-tag: scylla-operator-bundle-${{ github.run_id }}
      catalog-image-tag: scylla-operator-catalog-${{ github.run_id }}
    secrets:
      registry-auth-json: ${{ secrets.QUAY_SCYLLADB_DEV_PR_PUBLISHER_CREDS }}

  e2e:
    needs:
      - image
      - olm
    uses: ./.github/workflows/_e2e-jobs.yaml
    with:
      image-ref: ${{ needs.image.outputs.image-ref }}
      olm-catalog-image-ref: ${{ needs.olm.outputs.catalog-ref }}
      # TODO: Restore the OKE jobs to the release gate when https://scylladb.atlassian.net/browse/OPERATOR-505 is resolved.
      jobs: '["!oke-*"]'
    secrets:
      ci-provisioners-kubeconfig: ${{ secrets.CI_PROVISIONERS_KUBECONFIG }}

  # Checks the bundle against Red Hat's certification requirements ahead of a release, without submitting the results.
  openshift-preflight:
    needs: olm
    uses: ./.github/workflows/_openshift-preflight.yaml
    with:
      name: openshift-preflight
      olm-bundle-image-ref: ${{ needs.olm.outputs.bundle-ref }}
      olm-catalog-image-ref: ${{ needs.olm.outputs.catalog-ref }}
    secrets:
      ci-provisioners-kubeconfig: ${{ secrets.CI_PROVISIONERS_KUBECONFIG }}

  # Checks the image against Red Hat's certification requirements ahead of a release, without submitting the results.
  image-preflight:
    needs: image
    uses: ./.github/workflows/_image-preflight.yaml
    with:
      image-repo-ref: *dev-image-repo-ref
      # The tag the image job pushes. One of the checks requires a tag.
      image-tag: scylla-operator-${{ github.run_id }}
    secrets:
      pyxis-api-token: ${{ secrets.CERTIFICATION_PYXIS_API_KEY }}

  # Creating the version tag relies on GitHub Actions being a bypass actor of the version tag ruleset.
  tag:
    needs:
    - plan-release
    - image
    - e2e
    - image-preflight
    - openshift-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Push the tag
      uses: ./.github/actions/release/push-tag
      with:
        tag: ${{ needs.plan-release.outputs.tag }}
        image-ref: ${{ needs.image.outputs.image-ref }}

  # Copies the image the gate ran against, so what was tested is what ships. Runs on a redispatch too, where the jobs
  # it needs are skipped.
  promote:
    needs:
    - plan-release
    - image
    - tag
    if: ${{ !cancelled() && !failure() && (needs.plan-release.outputs.tag-exists == 'true' || needs.tag.result == 'success') }}
    strategy:
      fail-fast: false
      matrix:
        image-repo-ref:
        - quay.io/scylladb/scylla-operator
        - docker.io/scylladb/scylla-operator
    name: promote (${{ matrix.image-repo-ref }})
    runs-on: ubuntu-latest
    container:
      image: quay.io/scylladb/scylla-operator-images:kube-tools
    timeout-minutes: 30
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Write registry auth
      uses: ./.github/actions/write-registry-auth
      with:
        auth-json: |
          ${{ secrets.QUAY_SCYLLADB_PROD_PUBLISHER_CREDS }}
          ${{ secrets.DOCKERHUB_SCYLLADB_PROD_PUBLISHER_CREDS }}

    - name: Copy the image
      uses: ./.github/actions/release/promote-image
      with:
        source-image-ref: ${{ needs.image.outputs.image-ref || needs.plan-release.outputs.image-ref }}
        image-repo-ref: ${{ matrix.image-repo-ref }}
        version: ${{ inputs.version }}
        rolling-tags: ${{ needs.plan-release.outputs.rolling-tags }}

  # Submits the preflight results of the published image to its Red Hat certification component.
  certify-image:
    needs:
    - plan-release
    - promote
    if: ${{ !cancelled() && !failure() && needs.promote.result == 'success' }}
    uses: ./.github/workflows/_image-preflight.yaml
    with:
      image-repo-ref: docker.io/scylladb/scylla-operator
      image-tag: ${{ inputs.version }}
      submit: true
    secrets:
      pyxis-api-token: ${{ secrets.CERTIFICATION_PYXIS_API_KEY }}

  # Publishes the charts once the image they default to exists. The index is read, merged and written back, which relies
  # on the concurrency group to keep two releases from publishing at once.
  helm:
    needs:
    - plan-release
    - promote
    if: ${{ !cancelled() && !failure() && needs.promote.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout the release
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ needs.plan-release.outputs.tag }}
        path: release
        persist-credentials: false

    - name: Checkout the tooling
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        path: tooling
        persist-credentials: false

    - name: Authenticate to GCS
      env:
        GCS_CREDENTIALS_JSON: ${{ secrets.HELM_CHARTS_GCS_PROD_PUBLISHER_CREDS }}
      run: |
        set -euo pipefail
        shopt -s inherit_errexit

        umask 077
        printenv GCS_CREDENTIALS_JSON > "${RUNNER_TEMP}/gcs-credentials.json"
        gcloud auth activate-service-account --key-file="${RUNNER_TEMP}/gcs-credentials.json"

    - name: Publish the charts
      env:
        BUCKET_URL: gs://scylla-operator-charts/stable
        REPOSITORY_URL: https://scylla-operator-charts.storage.googleapis.com/stable
        TAG: ${{ needs.plan-release.outputs.tag }}
        VERSION: ${{ inputs.version }}
      # The script packages the charts from the working directory, which is the release checkout.
      working-directory: release
      run: ../tooling/hack/.ci/release/publish-helm-charts.sh "${BUCKET_URL}" "${REPOSITORY_URL}" "${TAG}" "${VERSION}"

  # Without a condition of its own, a job runs only if every job before it succeeded, and a redispatch skips some.
  github-release:
    needs:
    - plan-release
    - helm
    if: ${{ !cancelled() && !failure() && needs.helm.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Create the release
      uses: ./.github/actions/release/create-github-release
      with:
        version: ${{ inputs.version }}
        tag: ${{ needs.plan-release.outputs.tag }}
        prerelease: ${{ needs.plan-release.outputs.prerelease }}
        latest: ${{ needs.plan-release.outputs.latest }}
        image-repo-ref: docker.io/scylladb/scylla-operator

  certify-olm-bundle:
    needs:
    - plan-release
    - github-release
    if: ${{ !cancelled() && !failure() && needs.github-release.result == 'success' }}
    runs-on: hosted-runners-standard-pool
    container:
      image: quay.io/scylladb/scylla-operator-images:kube-tools
    timeout-minutes: 180
    steps:
    - name: Checkout the release
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ needs.plan-release.outputs.tag }}
        path: release
        # postprocess-bundle.sh lists the release tags to compute spec.replaces, and a shallow checkout has none.
        fetch-depth: 0
        persist-credentials: false

    - name: Checkout the tooling
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        path: tooling
        persist-credentials: false

    - name: Materialize the cluster kubeconfig
      id: kubeconfig
      uses: ./tooling/.github/actions/materialize-secret
      with:
        name: OPENSHIFT_CERTIFICATION_CLUSTER_KUBECONFIG
        content: ${{ secrets.OPENSHIFT_CERTIFICATION_CLUSTER_KUBECONFIG }}

    - name: Materialize the cd-bot SSH key
      id: ssh-key
      uses: ./tooling/.github/actions/materialize-secret
      with:
        name: SCYLLADB_OPERATOR_CD_BOT_SSH
        content: ${{ secrets.SCYLLADB_OPERATOR_CD_BOT_SSH }}

    # The script leaves a version that's already in certified-operators or has an open PR from the bot unchanged.
    # To replace the bundle of an open PR, close it and dispatch the release again.
    - name: Certify the bundle
      env:
        TAG: ${{ needs.plan-release.outputs.tag }}
        SUBMIT: "true"
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        KUBECONFIG: ${{ steps.kubeconfig.outputs.path }}
        SSH_KEY: ${{ steps.ssh-key.outputs.path }}
      # The script takes the bundle from the working directory, which is the release checkout.
      working-directory: release
      run: ../tooling/hack/.ci/olm/certify-bundle.sh "${TAG}" "${SSH_KEY}"
