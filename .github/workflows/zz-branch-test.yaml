name: zz-branch-test

# TEMPORARY. Delete before merging.
#
# workflow_dispatch only becomes available once a workflow is on the default branch, so validating these before they
# merge needs a push trigger scoped to this branch. Runs the same chain periodics.yaml does, narrowed to one suite.
on:
  push:
    branches:
    - operator-438-e2e-periodics

permissions:
  contents: read

jobs:
  image:
    uses: ./.github/workflows/_image.yaml
    with:
      image-tag: scylla-operator-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
    secrets:
      registry-auth-json: ${{ secrets.QUAY_SCYLLADB_DEV_PR_PUBLISHER_CREDS }}

  e2e-gke-parallel:
    needs: image
    uses: ./.github/workflows/_e2e-gke.yaml
    with:
      name: branch-test
      image-ref: ${{ needs.image.outputs.image-ref }}
      suite: scylla-operator/conformance/parallel
      object-storage: true
      node-pools: |
        - name: workers
          locations:
          - us-central1-a
          config:
            machineType: e2-standard-8
            diskType: pd-standard
            diskSizeGB: 40
            labels:
              pool: workers
          initialNodeCount: 1
        - name: scylladb
          locations:
          - us-central1-a
          config:
            machineType: n2d-standard-8
            diskType: pd-balanced
            diskSizeGB: 40
            localNVMeSSDBlockConfig:
              localSSDCount: 1
            labels:
              pool: scylladb
              scylla.scylladb.com/node-type: scylla
            taints:
            - key: scylla-operator.scylladb.com/dedicated
              value: scyllaclusters
              effect: NO_SCHEDULE
            kubeletConfig:
              cpuManagerPolicy: static
          initialNodeCount: 1
    secrets:
      ci-provisioners-kubeconfig: ${{ secrets.CI_PROVISIONERS_KUBECONFIG }}
