# This DaemonSet configures systemd-coredump on nodes running ScyllaDB so that
# core dumps are captured and stored on the host filesystem at
# /var/lib/systemd/coredump/.
#
# A single long-running container performs the following setup steps:
#   1. Install systemd-coredump if the host doesn't ship it. Only the
#      installation method depends on the host operating system.
#   2. Apply the recommended /etc/systemd/coredump.conf configuration.
#   3. Set kernel.core_pattern to pipe core dumps through systemd-coredump.
#   4. Start systemd-coredump.socket so the helper can connect to it when a
#      crash occurs.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: scylladb-coredump-setup
  namespace: scylla-operator
  labels:
    app.kubernetes.io/name: scylladb-coredump-setup
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: scylladb-coredump-setup
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scylladb-coredump-setup
    spec:
      # Target only the nodes that run ScyllaDB workloads.
      nodeSelector:
        scylla.scylladb.com/node-type: scylla
      tolerations:
      - key: scylla-operator.scylladb.com/dedicated
        operator: Equal
        value: scyllaclusters
        effect: NoSchedule
      serviceAccountName: scylladb-coredump-setup
      # hostPID is required so that "nsenter -t 1" targets the host's systemd
      # (PID 1) rather than the container's init process. This is needed for
      # systemctl to communicate with the host's D-Bus and start
      # systemd-coredump.socket.
      hostPID: true
      containers:
      - name: setup-coredump
        image: docker.io/library/ubuntu:24.04
        imagePullPolicy: IfNotPresent
        securityContext:
          privileged: true
        readinessProbe:
          exec:
            command:
            - cat
            - /tmp/setup-complete
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            cpu: 1m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 128Mi
        command:
        - /bin/bash
        - -euEo
        - pipefail
        - -O
        - inherit_errexit
        - -c
        - |
          # Run a command inside the host's mount + UTS namespaces using nsenter
          # so that package managers and sysctl operate on the real host.
          host_exec() {
            nsenter --mount=/host/proc/1/ns/mnt --uts=/host/proc/1/ns/uts -- "$@"
          }

          # Some host operating systems ship systemd-coredump with systemd
          # (e.g. RHCOS on OpenShift), others need it installed
          # (e.g. Ubuntu on GKE).
          if host_exec test -x /usr/lib/systemd/systemd-coredump; then
            echo "systemd-coredump is already installed on the host."
          else
            HOST_OS_ID="$(host_exec sh -c '. /etc/os-release && echo "${ID}"')"
            # Add a case for each host operating system that needs systemd-coredump installed.
            case "${HOST_OS_ID}" in
            ubuntu)
              echo "Installing systemd-coredump via apt-get..."
              host_exec apt-get update -y -qq
              host_exec apt-get install -y -qq systemd-coredump
              ;;
            *)
              echo "systemd-coredump is not installed on the host and installing it on ${HOST_OS_ID@Q} is not supported." >&2
              exit 1
              ;;
            esac
          fi

          # Apply the coredump configuration from the mounted ConfigMap.
          if [ -f /config/coredump.conf ]; then
            echo "Applying custom /etc/systemd/coredump.conf..."
            cp /config/coredump.conf /host/etc/systemd/coredump.conf
            nsenter -t 1 --mount --uts --ipc --net -- systemctl daemon-reload || true
          fi

          # The arguments systemd-coredump expects in kernel.core_pattern differ
          # between systemd versions, so use the sysctl configuration shipped
          # with the host's systemd-coredump.
          SYSCTL_CONF='/usr/lib/sysctl.d/50-coredump.conf'
          echo "Applying ${SYSCTL_CONF}..."
          host_exec sysctl -p "${SYSCTL_CONF}"

          # Pass a large hardcoded value in place of %c (the core file size rlimit
          # of the crashing process) to prevent truncation. Newer systemd versions
          # already ship it this way.
          CORE_PATTERN="$(host_exec sysctl -n kernel.core_pattern)"
          if [[ "${CORE_PATTERN}" != *systemd-coredump* ]]; then
            echo "Unexpected kernel.core_pattern after applying ${SYSCTL_CONF}: ${CORE_PATTERN@Q}" >&2
            exit 1
          fi
          host_exec sysctl -w "kernel.core_pattern=${CORE_PATTERN//%c/9223372036854775808}"

          echo "kernel.core_pattern is now:"
          host_exec sysctl -n kernel.core_pattern

          # Start systemd-coredump.socket on the host so the helper can hand off
          # the core image for processing. Without an active socket the helper
          # exits silently and no core file is written.
          # nsenter -t 1 with mount+UTS+IPC+net namespaces makes the host binaries
          # and the D-Bus socket visible to systemctl.
          echo "Starting systemd-coredump.socket on the host..."
          nsenter -t 1 --mount --uts --ipc --net -- systemctl start systemd-coredump.socket
          echo "systemd-coredump.socket is now active."

          # Keep the pod running so that the DaemonSet re-applies the settings
          # on eviction or reschedule.
          echo "Setup complete. Sleeping indefinitely..."
          touch /tmp/setup-complete
          exec sleep infinity
        volumeMounts:
        - name: host
          mountPath: /host
        - name: coredump-config
          mountPath: /config
          readOnly: true
      volumes:
      - name: host
        hostPath:
          path: /
          type: Directory
      - name: coredump-config
        configMap:
          name: scylladb-coredump-conf
  updateStrategy:
    type: RollingUpdate
