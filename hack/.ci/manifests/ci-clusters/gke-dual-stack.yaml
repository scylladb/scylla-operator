apiVersion: ci.scylladb.com/v1alpha1
kind: KubernetesCluster
metadata:
  # Filled in per run.
  name: ""
spec:
  credentialsSecret:
    # Filled in per run.
    name: ""
  version: "1.35"
  ttlSeconds: 14400
  type: GKE
  gke:
    location: europe-west4
    # IPV4_IPV6 needs a custom mode VPC network, which the default one isn't.
    network: ci-dual-stack-network
    ipAllocationPolicy:
      stackType: IPV4_IPV6
    nodePools:
    - name: workers
      locations:
      - europe-west4-a
      config:
        machineType: e2-standard-8
        diskType: pd-standard
        diskSizeGB: 40
        labels:
          pool: workers
      initialNodeCount: 1
    - name: scylladb
      locations:
      - europe-west4-a
      config:
        machineType: n2d-standard-8
        diskType: pd-balanced
        diskSizeGB: 40
        localNVMeSSDBlockConfig:
          localSSDCount: 1
        labels:
          pool: scylladb
          scylla.scylladb.com/node-type: scylla
        taints:
        - key: scylla-operator.scylladb.com/dedicated
          value: scyllaclusters
          effect: NO_SCHEDULE
        kubeletConfig:
          cpuManagerPolicy: static
      initialNodeCount: 1
