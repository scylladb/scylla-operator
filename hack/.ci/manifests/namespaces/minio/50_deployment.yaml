apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
      - name: minio
        # MinIO has withdrawn its container images: quay.io/minio/minio and docker.io/minio/minio now return
        # 401 for anonymous pulls of all tags, including the previously pinned final community release. This is the
        # Bitnami Legacy build of the last freely released MinIO server, frozen with no further updates, and the
        # closest maintained public mirror. TODO: move to a ScyllaDB-controlled mirror.
        image: docker.io/bitnamilegacy/minio:2025.7.23-debian-12-r5@sha256:6dabb4a2088c9a79908de3bc05f4586c23ad2182c8908e7e3acbf61c1467fb20
        command:
        - minio
        - server
        - /data
        env:
        - name: MINIO_ROOT_USER
          value: minioadmin
        - name: MINIO_ROOT_PASSWORD
          value: minioadmin
        ports:
        - name: api
          containerPort: 9000
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /minio/health/ready
            port: 9000
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: minio-data
